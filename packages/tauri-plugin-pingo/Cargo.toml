[package]
name = "tauri-plugin-pingo"
version = "0.1.0"
description = "Plugin nativo do Pingo: cofre de segredos no Keystore do Android, Compartilhar, microfone e mais"
authors = ["Pingo"]
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-pingo"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
